name: Modal Deploy

on:
  workflow_dispatch:
    inputs:
      modal_region:
        description: 'Modal 运行区域，多个用英文逗号分隔；留空表示不固定区域。'
        required: false
        default: ''
        type: string
      modal_nonpreemptible:
        description: '是否启用非抢占 (true / false)'
        required: false
        default: 'false'
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Modal CLI
        run: |
          python -m pip install --upgrade pip
          pip install modal

      - name: Deploy with Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          # 原作者的脚本应该会在底层读取这两个环境变量
          MODAL_REGION: ${{ github.event.inputs.modal_region }}
          MODAL_NONPREEMPTIBLE: ${{ github.event.inputs.modal_nonpreemptible }}
        run: |
          set -euo pipefail
          modal deploy main.py
